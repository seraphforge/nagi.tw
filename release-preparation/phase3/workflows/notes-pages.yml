# FINAL CANDIDATE — inactive here; install only after final release approval.
name: Notes Astro Pages
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the validated artifact to production
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin verified npm version
        run: npm install --global npm@11.6.2
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run validate
      - run: node scripts/validate-ui.mjs
      - run: node scripts/validate-taxonomy.mjs
      - name: Verify language and category runtime
        env:
          NAGI_TEST_URL: http://127.0.0.1:4321
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/notes-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$NAGI_TEST_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$NAGI_TEST_URL/" > /dev/null
          npm run validate:runtime
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
